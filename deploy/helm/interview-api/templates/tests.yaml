apiVersion: v1
kind: Pod
metadata:
  name: {{ include "interview-api.fullname" . }}-test
  labels:
    {{- include "interview-api.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: smoke-test
      image: busybox:1.37.0
      command: ["wget", "-qO-", "http://{{ include "interview-api.fullname" . }}:{{ .Values.service.port }}/health/ready"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
