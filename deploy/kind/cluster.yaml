kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: interview
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP
  - role: worker
    labels:
      topology.kubernetes.io/zone: local-zone-a
  - role: worker
    labels:
      topology.kubernetes.io/zone: local-zone-b
  - role: worker
    labels:
      topology.kubernetes.io/zone: local-zone-c
